openapi: 3.0.3
info:
  title: Nexus Broker API
  version: 0.2.6
  description: |
    Internal API for the Nexus Broker service. 
    This service handles OAuth 2.0 and OIDC flows, encrypts tokens, and manages provider configurations.
    It is NOT intended to be exposed directly to the public internet, except for the `/auth/callback` endpoint.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://broker.internal
    description: Production (Internal)
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    ProviderProfile:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Unique slug for the provider (e.g. "google", "github")
        auth_type:
          type: string
          enum: [oauth2, api_key, basic_auth, header, query_param, hmac_payload, aws_sigv4]
          default: oauth2
        auth_header:
          type: string
          enum: [client_secret_post, client_secret_basic]
          description: Method for sending client secret during token exchange.
        client_id:
          type: string
        client_secret:
          type: string
        auth_url:
          type: string
        token_url:
          type: string
        api_base_url:
          type: string
          description: Root URL for the provider's API (e.g., https://api.github.com)
        user_info_endpoint:
          type: string
          description: Path to fetch user info (e.g., /user)
        scopes:
          type: array
          items: { type: string }
        params:
          type: object
          description: Provider-specific extra parameters (e.g., prompt, access_type)
        description:
          type: string
          description: Human-readable description of the provider
        category:
          type: string
          description: Category grouping for the provider (e.g. "CRM & Sales", "Analytics")

    ProviderProfilePatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Unique slug for the provider (e.g. "google", "github")
        auth_type:
          type: string
          enum: [oauth2, api_key, basic_auth, header, query_param, hmac_payload, aws_sigv4]
        auth_header:
          type: string
          enum: [client_secret_post, client_secret_basic]
          description: Method for sending client secret during token exchange.
        client_id:
          type: string
        client_secret:
          type: string
        auth_url:
          type: string
        token_url:
          type: string
        api_base_url:
          type: string
          description: Root URL for the provider's API (e.g., https://api.github.com)
        user_info_endpoint:
          type: string
          description: Path to fetch user info (e.g., /user)
        scopes:
          type: array
          items: { type: string }
        params:
          type: object
          description: Provider-specific extra parameters (e.g., prompt, access_type)
        description:
          type: string
          description: Human-readable description of the provider
        category:
          type: string
          description: Category grouping for the provider (e.g. "CRM & Sales", "Analytics")

    ConsentSpecRequest:
      type: object
      required: [workspace_id, return_url]
      properties:
        workspace_id:
          type: string
        provider_id:
          type: string
        scopes:
          type: array
          items: { type: string }
        return_url:
          type: string
    
    ConsentSpecResponse:
      type: object
      properties:
        authUrl:
          type: string
        state:
          type: string
        scopes:
          type: array
          items: { type: string }
        provider_id:
          type: string
    
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string }
        refresh_token: { type: string }
        expiry: { type: string, format: date-time }
        id_token: { type: string }
        strategy:
          type: object
          description: Auth strategy configuration (e.g. type, config)
          additionalProperties: true
        credentials:
          type: object
          description: Decrypted credentials map
          additionalProperties: true
        health_status:
          type: string
          enum: [healthy, unhealthy, degraded, expired, unknown]
          description: Current health status of the connection

    ProviderHealthStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        health_status:
          type: string
          enum: [healthy, unhealthy, degraded, unknown]
        last_health_check_at:
          type: string
          format: date-time
          nullable: true
        health_message:
          type: string
          description: Human-readable detail when status is not healthy

    ConnectionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        provider_name:
          type: string
        auth_type:
          type: string
          enum: [oauth2, api_key, basic_auth]
        status:
          type: string
        scopes:
          type: array
          items: { type: string }
        health_status:
          type: string
          enum: [healthy, unhealthy, degraded, expired, unknown]
        last_health_check_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    MetadataResponse:
      type: object
      description: Grouped provider metadata
      additionalProperties:
        type: object
        additionalProperties:
          type: object
          properties:
            id: { type: string }
            api_base_url: { type: string }
            user_info_endpoint: { type: string }
            description: { type: string }
            category: { type: string }
            scopes:
              type: array
              items: { type: string }

paths:
  /providers:
    get:
      summary: List all providers
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200':
          description: List of providers (id and name only)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
    post:
      summary: Register a new provider
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  $ref: '#/components/schemas/ProviderProfile'
      responses:
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  message: { type: string }

  /providers/metadata:
    get:
      summary: Get grouped integration metadata
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200':
          description: Metadata map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'

  /providers/{id}:
    get:
      summary: Get provider details
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Provider profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfile'
    put:
      summary: Update provider details
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProfile'
      responses:
        '200':
          description: Updated successfully
    patch:
      summary: Partially update provider details
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProfilePatch'
      responses:
        '200':
          description: Patched successfully
    delete:
      summary: Delete provider
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted successfully

  /providers/by-name/{name}:
    get:
      summary: Get provider ID by name
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Provider id and name
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }

  /auth/consent-spec:
    post:
      summary: Generate authorization URL
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentSpecRequest'
      responses:
        '200':
          description: Authorization URL and state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentSpecResponse'

  /auth/callback:
    get:
      summary: OAuth callback handler (Public)
      description: The provider redirects the user here. Validates state and exchanges code for token.
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
      responses:
        '302':
          description: Redirects to the stored return_url with connection_id

  /auth/capture-schema:
    get:
      summary: Get credential capture schema for API-key providers
      description: Returns a JSON Schema for the credential capture form. Used by frontends for api_key/basic_auth providers.
      parameters:
        - in: query
          name: state
          required: true
          schema: { type: string }
          description: Signed HMAC state token from the consent spec
      responses:
        '200':
          description: Credential capture schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider_name: { type: string }
                  schema:
                    type: object
                    description: JSON Schema for the credential form fields
        '400':
          description: Invalid or expired state
        '404':
          description: Provider not found or no schema configured

  /auth/capture-credential:
    post:
      summary: Submit captured credentials for API-key providers
      description: Encrypts and stores the submitted credentials, then redirects to the return_url.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, credentials]
              properties:
                state:
                  type: string
                  description: Signed HMAC state token
                credentials:
                  type: object
                  description: 'Key-value credential map (e.g. {"api_key": "..."})'
                  additionalProperties: true
      responses:
        '302':
          description: Redirects to the return_url with status=success
        '400':
          description: Invalid state or credentials rejected by provider
        '404':
          description: Connection not found

  /providers/health:
    get:
      summary: Get health status of all providers
      description: Returns the current health status of all registered providers. No credentials are included.
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200':
          description: Provider health statuses. Returns `[]` when no providers exist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderHealthStatus'

  /connections:
    get:
      summary: List connections for a workspace
      description: Returns all non-pending connections for a workspace with their health status. No credentials or tokens are included.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: query
          name: workspace_id
          required: true
          schema: { type: string }
          description: Workspace ID to filter connections by
      responses:
        '200':
          description: List of connection summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionSummary'
        '400':
          description: Missing workspace_id parameter

  /connections/resolve:
    get:
      summary: Resolve and retrieve token by workspace and provider
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: query
          name: workspace_id
          required: true
          schema: { type: string }
        - in: query
          name: provider_name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Stored token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '404':
          description: Connection not found

  /connections/{connectionID}/token:
    get:
      summary: Retrieve stored token
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: connectionID
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Stored token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /connections/{connectionID}/refresh:
    post:
      summary: Force refresh token
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: connectionID
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Refreshed token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Healthy
