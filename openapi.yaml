openapi: 3.0.3
info:
  title: Nexus Gateway API
  version: 0.3.0
  description: |
    Stable v1 contract for the Nexus Gateway. This spec freezes the agent-facing endpoints.
    Breaking changes require a new major version (e.g., /v2). Additive changes only in v1.
servers:
  - url: https://gateway.example.com
    description: Production
  - url: http://localhost:8090
    description: Local development
paths:
  /v1/providers:
    get:
      summary: Retrieve provider metadata
      operationId: getProviders
      responses:
        '200':
          description: Grouped provider configuration (base URLs, scopes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMetadataResponse'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamError'
  /v1/request-connection:
    post:
      summary: Initiate a user consent connection
      operationId: requestConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestConnectionInput'
      responses:
        '200':
          description: Consent created; redirect user to authUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamError'
  /v1/check-connection/{connection_id}:
    get:
      summary: Check connection status
      operationId: checkConnection
      parameters:
        - in: path
          name: connection_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamError'
  /v1/token/{connection_id}:
    get:
      summary: Retrieve token for a connection
      operationId: getToken
      parameters:
        - in: path
          name: connection_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token JSON proxied from Broker (opaque extras allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Connection not found
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamError'
  /v1/refresh/{connection_id}:
    post:
      summary: Force a token refresh for a connection
      operationId: refreshConnection
      parameters:
        - in: path
          name: connection_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Refreshed token JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Connection not found
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamError'
  /v1/connections/{connection_id}:
    delete:
      summary: Revoke a connection
      operationId: revokeConnection
      description: >
        Permanently revokes a connection. The stored credential is destroyed and
        the connection moves to the terminal `revoked` status; subsequent token
        requests return 410. Where the provider supports RFC 7009, the token is
        also revoked upstream — check `provider_revoked` to confirm, since the
        local credential is destroyed either way.


        The call is idempotent: revoking an already-revoked connection returns
        200 with `already_revoked: true`.
      parameters:
        - in: path
          name: connection_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: workspace_id
          required: false
          schema:
            type: string
          description: When supplied, must match the connection's workspace or the request returns 404.
        - in: query
          name: reason
          required: false
          schema:
            type: string
          description: Recorded on the connection and in the audit log.
      responses:
        '200':
          description: Revocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Connection not found
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/UpstreamError'
components:
  schemas:
    ProviderMetadataResponse:
      type: object
      description: Map of auth_type to provider config map
      additionalProperties:
        type: object
        additionalProperties:
          type: object
          properties:
            api_base_url: { type: string }
            user_info_endpoint: { type: string }
            scopes:
              type: array
              items: { type: string }
    RevokeResult:
      type: object
      description: Outcome of a connection revocation.
      properties:
        connection_id:
          type: string
          format: uuid
        provider_name:
          type: string
        status:
          type: string
          enum: [revoked]
        revoked_at:
          type: string
          format: date-time
        already_revoked:
          type: boolean
        token_deleted:
          type: boolean
        sessions_closed:
          type: integer
          format: int64
        provider_revoked:
          type: boolean
          description: >
            True only when the provider accepted an RFC 7009 revocation. False
            means the credential was destroyed inside Nexus but may remain valid
            at the provider until it expires.
        provider_revocation_error:
          type: string
    RequestConnectionInput:
      type: object
      additionalProperties: false
      required: [user_id, provider_name, scopes, return_url]
      properties:
        user_id:
          type: string
          description: Workspace or user identifier in the agent system
        provider_name:
          type: string
          description: Human-readable provider alias (e.g., Google, Microsoft)
        scopes:
          type: array
          items: { type: string }
        return_url:
          type: string
          format: uri
        metadata:
          type: object
          additionalProperties: true
    RequestConnectionResponse:
      type: object
      required: [authUrl, connection_id]
      properties:
        authUrl:
          type: string
          format: uri
        connection_id:
          type: string
        state:
          type: string
        scopes:
          type: array
          items: { type: string }
        provider_id:
          type: string
    ConnectionStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, pending, failed]
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string }
        expires_in: { type: number }
        expires_at: { oneOf: [{ type: number }, { type: string }] }
        scope: { type: string }
        id_token: { type: string }
        refresh_token: { type: string }
        provider: { type: string }
      additionalProperties: true
    ErrorEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      required: [code, message]
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamError:
      description: Upstream service error (Broker or provider)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
tags:
  - name: Connections
    description: Create and manage user connections
  - name: Tokens
    description: Retrieve tokens for active connections

