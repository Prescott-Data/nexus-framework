name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BROKER: Prescott-Data/nexus-broker
  IMAGE_NAME_GATEWAY: Prescott-Data/nexus-gateway
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The binaries report the VERSION file, never the git ref, so every
      # surface agrees. A tag that disagrees with the file is a release cut
      # outside the release workflow and is refused.
      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match VERSION=${VERSION}. Releases are cut by bumping VERSION, not by tagging."
            exit 1
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Broker
        id: meta-broker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BROKER }}

      - name: Extract metadata (tags, labels) for Gateway
        id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GATEWAY }}

      - name: Build and push Broker image
        uses: docker/build-push-action@v5
        with:
          context: ./nexus-broker
          file: ./nexus-broker/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta-broker.outputs.tags }}
          labels: ${{ steps.meta-broker.outputs.labels }}

      - name: Build and push Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./nexus-gateway
          file: ./nexus-gateway/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
